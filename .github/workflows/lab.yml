name: Laboratory

on:
  push:
    branches: [main]
    paths: ["lab/**", "kit/**", "package.json", "package-lock.json", ".github/workflows/lab.yml"]
  pull_request:
    paths: ["lab/**", "kit/**", "package.json", "package-lock.json", ".github/workflows/lab.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-laboratory:
    name: CPU laboratory on ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: lab/uv.lock
      - run: npm ci --ignore-scripts
      - run: uv sync --frozen --project lab
      - name: Verify the actual pinned CPU build and installed dependencies
        run: |
          mkdir -p .lab
          uv run --project lab python lab/scripts/verify-cpu-environment.py > .lab/ci-cpu-environment.json
      - run: uv run --project lab ruff check lab/src lab/tests lab/scripts
      - run: uv run --project lab ruff format --check lab/src lab/tests lab/scripts
      - run: uv run --project lab pytest -q lab/tests
      - run: npm run test:lab-mcp
      - name: Train and verify all nine fixed CPU trials
        run: |
          uv run --project lab python lab/scripts/validate-cpu.py --workspace .lab/ci-cpu-cohort --receipt .lab/ci-cpu-validation.json
      - name: Verify registered multiclass and regression training on public data
        run: |
          uv run --project lab python lab/scripts/validate-public-data.py --workspace .lab/ci-public-cpu-cohort --receipt .lab/ci-public-cpu-validation.json
      - name: Verify the ten frozen laboratory MCP tasks
        run: |
          uv run --project lab python lab/scripts/prepare-evaluation.py --workspace .lab/ci-frozen-pilot
          node lab/scripts/verify-evaluation.mjs .lab/ci-frozen-pilot .lab/ci-frozen-evaluation.json
      - name: Keep public CPU environment, trial and frozen-task receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-evidence-${{ matrix.os }}
          path: |
            .lab/ci-cpu-environment.json
            .lab/ci-cpu-validation.json
            .lab/ci-public-cpu-validation.json
            .lab/ci-frozen-evaluation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
