# Publishes one server from CI when a tag <server>-v<version> is pushed, for example
# weather-v0.2.0. npm gets a provenance attestation (trusted publishing through this job's GitHub
# OIDC token; no npm token is stored; one-time setting per package on npmjs.com: Trusted
# Publisher, GitHub Actions, owner arhancanli, repository mcp-factory, workflow release.yml).
# The MCP Registry entry uses the same OIDC token. A Claude Desktop bundle is built from the
# tagged files, signed with a Sigstore build-provenance attestation and attached to a GitHub
# release.
#
# Verify a bundle: gh attestation verify <file>.mcpb --repo arhancanli/mcp-factory
name: Release

on:
  push:
    tags: ["*-v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: The tag names an existing server and its version
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          server="${tag%-v*}"
          version="${tag##*-v}"
          dir="servers/$server"
          test -f "$dir/package.json" || { echo "no server $server"; exit 1; }
          test "$version" = "$(node -p "require('./$dir/package.json').version")" || { echo "tag version != package.json"; exit 1; }
          test "$version" = "$(node -p "require('./$dir/server.json').version")" || { echo "tag version != server.json"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./$dir/package.json').name")" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Publish to npm with provenance
        working-directory: ${{ steps.tag.outputs.dir }}
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; not publishing again"
          else
            npm publish --provenance --access public
          fi
          for attempt in $(seq 1 30); do
            npm view "$NAME@$VERSION" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm did not serve $VERSION within 5 minutes" >&2; exit 1
      - name: Publish to the MCP Registry
        working-directory: ${{ steps.tag.outputs.dir }}
        env:
          PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz "$PUBLISHER_URL"
          echo "$PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
      - name: Build the Claude Desktop bundle from the tagged files
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          stage="$(mktemp -d)"
          git archive HEAD "$DIR" | tar -x -C "$stage"
          src="$stage/$DIR"
          node scripts/mcpb-manifest.mjs "$DIR" > "$src/manifest.json"
          (cd "$src" && npm ci --omit=dev --ignore-scripts --silent)
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$src/manifest.json"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$src" "dist/$NAME-$VERSION.mcpb"
          (cd dist && sha256sum *.mcpb > SHA256SUMS.txt)
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mcpb
      - name: Create the GitHub release with the signed bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cp "$BUNDLE" "dist/$NAME-$VERSION.mcpb.sigstore.json"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$NAME $VERSION" --notes-file "${{ steps.tag.outputs.dir }}/CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
