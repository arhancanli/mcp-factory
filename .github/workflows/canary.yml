# Weekly live check: each server's test/live.canary.mjs calls the real upstream API, so a changed
# or broken upstream is caught within a week instead of by a user. A failure opens nothing
# automatically; it shows red on the Actions page and in the README badge.
name: Canary

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Live tests against the real upstreams
        run: |
          status=0
          for f in servers/*/test/live.canary.mjs; do
            [ -f "$f" ] || continue
            dir="$(dirname "$(dirname "$f")")"
            echo "== $dir"
            (cd "$dir" && node --test test/live.canary.mjs) || status=1
          done
          exit $status
